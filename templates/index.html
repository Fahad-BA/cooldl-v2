<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CoolDL</title>
  <link href="/static/tailwind.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-900 text-white flex items-center justify-center h-screen">
  <form method="post" action="/download" class="w-full max-w-md p-6 bg-gray-800 rounded-lg shadow">
    <h1 class="text-2xl font-bold mb-4 text-center">CoolDL</h1>
    <input type="text" name="video_url" placeholder="Paste video link..." required
           class="w-full p-3 rounded bg-gray-700 text-white mb-4 focus:outline-none focus:ring-2 focus:ring-purple-500" />
    <button type="submit" class="w-full p-3 bg-purple-600 hover:bg-purple-700 rounded font-semibold">
      Download
    </button>
{% if success %}
<p class="mt-4 text-green-400 text-center">
    Downloaded: <a href="{{ file_url }}" class="underline text-blue-400">Download</a>
</p>
{% elif error %}
<p class="mt-4 text-red-400 text-center">Download Failed, please check link.</p>
{% endif %}

  </form>
</body>
</html>
