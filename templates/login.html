<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <link href="/static/tailwind.css" rel="stylesheet" />
</head>
<body class="bg-gray-900 text-white flex items-center justify-center h-screen">
  <form method="post" action="/login" class="bg-gray-800 p-6 rounded shadow-md w-full max-w-sm">
    <h1 class="text-xl font-bold mb-4 text-center">Login</h1>
    <input name="username" type="text" placeholder="Username" class="w-full p-2 mb-4 rounded bg-gray-700" required />
    <input name="password" type="password" placeholder="Password" class="w-full p-2 mb-4 rounded bg-gray-700" required />
    <button type="submit" class="w-full bg-purple-600 hover:bg-purple-700 p-2 rounded">Login</button>
    {% if error %}
      <p class="text-red-400 mt-4 text-center">{{ error }}</p>
    {% endif %}
  </form>
</body>
</html>
